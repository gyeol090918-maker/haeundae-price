<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>가격 비교 | 메뉴가</title><link rel="stylesheet" href="styles.css?v=20260805-ocean-cat" /></head>
<body>
  <header class="site-header"><a class="brand logo-brand" href="index.html"><img src="logo.png" alt="해운대 얼마냥" /></a><nav><a href="index.html" data-i18n="navHome">홈</a><a class="active" href="price.html" data-i18n="navPrice">가격 비교</a><a href="map.html" data-i18n="navMap">리뷰</a></nav><select class="language" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select></header>
  <main class="page-shell">
    <div class="page-intro"><p class="eyebrow">PRICE CHECK</p><h1 data-i18n="priceTitle">해운대 메뉴 가격 비교</h1><p data-i18n="priceDesc">현재 가격을 입력하면 해운대 중앙값 및 전국 외식비 평균과 비교합니다.</p></div>
    <section class="comparison-layout">
      <form class="calculator-card" id="priceForm">
        <label for="menuSearch" data-i18n="menuLabel">메뉴 검색</label><input id="menuSearch" list="menuSuggestions" placeholder="메뉴명을 검색하세요" autocomplete="off" /><datalist id="menuSuggestions"></datalist><select id="menu" hidden></select>
        <label for="price" data-i18n="currentPrice">현재 메뉴 가격</label><div class="price-input"><input id="price" type="number" min="0" placeholder="예: 15000" /><span>원</span></div>
        <button class="button primary full" type="submit" data-i18n="checkPrice">적정 가격 확인</button>
        <p class="form-note" data-i18n="formNote">전국 평균은 16개 지역 외식비 평균 자료를 참고했습니다.</p>
      </form>
      <section class="result-card" aria-live="polite"><p class="eyebrow">PRICE RESULT</p><div id="resultEmpty"><h2 data-i18n="emptyTitle">가격을 입력해 주세요.</h2><p data-i18n="emptyDesc">입력한 가격이 어느 범위에 있는지 알려드립니다.</p></div><div id="resultContent" hidden></div></section>
    </section>
  </main><footer data-i18n="footerPrice">© 메뉴가 · 가격은 참고 정보이며 메뉴 구성·양·추가요금에 따라 달라질 수 있습니다.</footer><script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=11bd66684ae7b1cc117440ee61e52e2c&libraries=services"></script><script src="app.js?v=20260805-ocean-cat"></script>
</body></html>
